connectors:
  template1: &picolock_4
    type: Molex Pico-Lock
    pins: [1, 2, 3, 4]

  template2: &picolock_4_rev
    type: Molex Pico-Lock
    pins: [4, 3, 2, 1]

  imgtemplates:
    image: &picolock_down_4_l
      src: ../../connector_img/picolock/picolock-down-4-l.png
      height: 100
    image: &picolock_down_4_r
      src: ../../connector_img/picolock/picolock-down-4-r.png
      height: 100
    image: &picolock_up_4_l
      src: ../../connector_img/picolock/picolock-up-4-l.png
      height: 100
    image: &picolock_up_4_r
      src: ../../connector_img/picolock/picolock-up-4-r.png
      height: 100

  EPS RBF:
    <<: *picolock_4_rev
    pinlabels: [GND, GND, RBF, RBF]
    image:
      <<: *picolock_up_4_l

  HERACLES P201:
    <<: *picolock_4
    pinlabels: [RBF, RBF, GND, GND]
    image:
      <<: *picolock_up_4_r
    notes: CONFIRM POLARITY DOES NOT MATTER. IF IT DOES, REVERSE PIN LABELS.

cables:
  Ribbon Cable:
    wirecount: 4
    color_code: DIN
    show_wirecount: false
    length: 100000 mm

connections:
  - 
    - EPS RBF: [4-1]
    - Ribbon Cable: [1, 2, 3, 4]
    - HERACLES P201: [1-4]