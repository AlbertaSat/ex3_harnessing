connectors:
  template1: &picolock_4
    type: Molex Pico-Lock
    pins: [1, 2, 3, 4]

  template2: &picolock_4_rev
    type: Molex Pico-Lock
    pins: [4, 3, 2, 1]

  imgtemplates:
    image: &picolock_down_4_l
      src: ../../connector_img/picolock/picolock-down-4-l.png
      height: 100
    image: &picolock_down_4_r
      src: ../../connector_img/picolock/picolock-down-4-r.png
      height: 100
    image: &picolock_up_4_l
      src: ../../connector_img/picolock/picolock-up-4-l.png
      height: 100
    image: &picolock_up_4_r
      src: ../../connector_img/picolock/picolock-up-4-r.png
      height: 100

  ZENITH HYP P402:
    <<: *picolock_4
    pinlabels: [3V3, GND, SCL, SDA]
    image: 
      <<: *picolock_down_4_l
  ANTIRAM HYP P801:
    <<: *picolock_4
    pinlabels: [3V3, GND, SCL, SDA]
    image: 
      <<: *picolock_up_4_r
    notes: CONFIRM FEMALE ORIENTATION ON HM.

cables:
  Ribbon Cable:
    wirecount: 4
    color_code: DIN
    show_wirecount: false
    length: 100000 mm

connections:
  - 
    - ZENITH HYP P402: [1-4]
    - Ribbon Cable: [1-4]
    - ANTIRAM HYP P801: [1-4]



