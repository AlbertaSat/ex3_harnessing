connectors:
  template1: &picolock_4
    type: Molex Pico-Lock
    pins: [1, 2, 3, 4]

  template2: &picolock_4_rev
    type: Molex Pico-Lock
    pins: [4, 3, 2, 1]

  imgtemplates:
    image: &picolock_down_4_l
      src: ../../connector_img/picolock/picolock-down-4-l.png
      height: 100
    image: &picolock_down_4_r
      src: ../../connector_img/picolock/picolock-down-4-r.png
      height: 100
    image: &picolock_up_4_l
      src: ../../connector_img/picolock/picolock-up-4-l.png
      height: 100
    image: &picolock_up_4_r
      src: ../../connector_img/picolock/picolock-up-4-r.png
      height: 100


  PORT HYP P804:
    <<: *picolock_4
    pinlabels: [VPortD+, VPortD+, VPortD-, VPortD-]
    image: 
      <<: *picolock_down_4_l
    notes: 'Branch Length: XX mm'
  SBOARD HYP P804:
    <<: *picolock_4_rev
    pinlabels: [VStarD-, VStarD-, VStarD+, VStarD+]
    image: 
      <<: *picolock_up_4_l
    notes: 'Branch Length: XX mm'


  EPS SP1: 
    <<: *picolock_4_rev
    pinlabels: [PGND, PGND, V+, V+]
    image: 
      <<: *picolock_down_4_r
    notes: See double-headed harness instructions.
  EPS SP2: 
    <<: *picolock_4
    pinlabels: [V+, V+, PGND, PGND]
    image: 
      <<: *picolock_up_4_r
      height: 100
    notes: See double-headed harness instructions.

cables:
  Fused Ribbon Cable:
    wirecount: 8
    color_code: DIN
    show_wirecount: false
    length: 100000 mm
    notes: 'Total Length Needed: XX mm'


connections:
  - 
    - PORT HYP P804: [1-4]
    - Ribbon Cable: [7, 5, 3, 1]
    - EPS SP1: [1-4]
  -
    - SBOARD HYP P804: [4-1]
    - Ribbon Cable: [2, 4, 6, 8]
    - EPS SP2: [1-4]


