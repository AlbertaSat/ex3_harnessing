[project]
name = "ex3-harnessing"
version = "0.1.0"
description = "Harnessing for the Ex-Alta 3 cubesat"
authors = [
    {name = "samldr",email = "sleader@ualberta.ca"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "graphviz (>=0.21,<0.22)",
    "wireviz (>=0.4.1,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
